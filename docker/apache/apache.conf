<Directory /app/>
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted

	SetEnvIf X_FORWARDED_PROTO https HTTPS=on

	# AllowOverride None means public/.htaccess is ignored here, so these are set directly.
	<IfModule mod_headers.c>
		Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "no-referrer, strict-origin-when-cross-origin"
		# Features disabled by default: adjust per project if any of them is actually
		# used (e.g. geolocation, payment via a native Payment Request API...).
		Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=(), magnetometer=()"

		# CSP on static files only: they are served directly by Apache without going through Symfony,
		# so they don't get the application CSP. Do not set it globally: it would be added to the
		# application's own CSP on pages (two CSPs = intersection of the policies). A non-existent static
		# file is rewritten to the front controller (FilesMatch doesn't match), so it stays handled by the application.
		<FilesMatch "\.(css|js|json|webmanifest|map|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$">
			Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
		</FilesMatch>
	</IfModule>
</Directory>

LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
